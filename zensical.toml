[project]
site_url = "https://www.fact-sealevel.github.io/"
site_name = "fact-sealevel (FACTS2)"
# site_description = "This is the organizational landing page for FACTS2"
# site_author = "Your name"

# copyright = "Copyright &copy; 2026 Your name"

# repo_url = "https://github.com/fact-sealevel/fact-sealevel.github.io"
# repo_name = "fact-sealevel/fact-sealevel.github.io"
# edit_uri = "edit/main/docs/"

nav = [
  { "Welcome to fact-sealevel" = "index.md" },
  { "FACTS Overview"= [
      "about_facts/index.md",
          {"FACTS Experiments" = "facts_overview/facts_experiment.md"},
          {"FACTS Modules" = "facts_overview/facts_module.md"},
          {"Glossary" = "facts_overview/glossary.md"},
        ]
    },
  { "Module Contributor Guide" = [
      "module_contributor_docs/index.md",
          {"Module Requirements" = "module_contributor_docs/module_requirements.md"},
          {"Tutorial: Building a FACTS Module" = "module_contributor_docs/build_facts_module_tutorial.md"},
          {"Tutorial: Submitting a module to the FACTS Module Registry" = "module_contributor_docs/submit_module_to_fmr_tutorial.md"},
          {"Module Template Overview" = "module_contributor_docs/module_template_overview.md"},
  ]
  },
  
  {"Getting started with FACTS"=[
      "getting_started/index.md",
        {"Installation" = "getting_started/installation_instructions.md"},
        {"Downloading module input data" = "getting_started/downloading_input_data.md"},
  ]
  },
]

# extra_css = ["stylesheets/extra.css"]
extra_javascript = [
  "javascripts/extra.js",
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
  ]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
 "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  #"navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = {
  permalink = true
}
pymdownx.arithmatex = {
  generic = true
}
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji = {
  emoji_generator = "zensical.extensions.emoji.to_svg",
  emoji_index = "zensical.extensions.emoji.twemoji",
}
pymdownx.highlight = {
  anchor_linenums = true,
  line_spans = "__span",
  pygments_lang_class = true,
}
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets = {
   base_path = "includes",
}
pymdownx.superfences = {
  custom_fences = [
    {
      name = "mermaid",
      class = "mermaid",
      format = "pymdownx.superfences.fence_code_format",
    },
  ],
}
pymdownx.tabbed = {
  alternate_style = true,
  combine_header_slug = true
}
pymdownx.tasklist = {
  custom_checkbox = true
}
pymdownx.tilde = {}
